services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - bliiva_mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: bliiva_support
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - bliiva_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    image: bliiva:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - '3100:3000'
    env_file:
      - .env
    extra_hosts:
      # So Linux Docker can reach Blivap on the host (Mac/Windows already provide this).
      - 'host.docker.internal:host-gateway'
    environment:
      PORT: 3000
      # Container loopback is not the host Ollama. Use the compose service DNS.
      LLM_BASE_URL: http://ollama:11434
      LLM_ENABLED: 'true'
      # Small Docker Desktop RAM: keep one chat model loaded, skip embed thrash.
      RAG_ENABLED: 'false'
      LLM_NUM_CTX: 1024
      LLM_MAX_OUTPUT_TOKENS: 128
      LLM_MAX_CONTEXT_TOKENS: 1536
      LLM_TIMEOUT_MS: 180000
      LLM_KEEP_ALIVE: 30m
      MONGODB_URI: mongodb://mongo:27017/bliiva_support
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 1
      # .env's localhost:2001 is the container itself — reach Blivap on the host.
      BLIVAP_API_BASE_URL: http://host.docker.internal:2001
      BLIVAP_CLIENT: http
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Optional local inference. Do not publish 11434 beyond the developer machine.
  # Usage: docker compose --profile llm up -d
  # Then: docker compose exec ollama ollama pull qwen3:1.7b
  #        docker compose exec ollama ollama pull nomic-embed-text
  ollama:
    profiles: ['llm']
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - ${OLLAMA_DATA:-bliiva_ollama_data}:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      # Leave headroom on ~4GB Docker Desktop VMs.
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Warm qwen once so the first support chat does not race model load.
  ollama-warm:
    profiles: ['llm']
    image: ollama/ollama:latest
    restart: 'no'
    volumes:
      - ${OLLAMA_DATA:-bliiva_ollama_data}:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'ollama pull qwen3:1.7b && ollama run qwen3:1.7b /no_think hi',
      ]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  bliiva_mongo_data:
  bliiva_redis_data:
  bliiva_ollama_data:
