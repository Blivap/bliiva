# All runtime data stays under this project directory:
#   ./.ollama  — chat + embedding model weights
#   ./data/mongo, ./data/redis — databases
# Run from the app folder:  docker compose up -d --build
# Or:  ./scripts/docker-up.sh

name: bliiva

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - ./data/mongo:/data/db
    environment:
      MONGO_INITDB_DATABASE: bliiva_support
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Local Qwen3 + embeddings. Weights only from this repo's ./.ollama.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - ./.ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # Ensure models exist in ./.ollama and warm the chat model once.
  ollama-warm:
    image: ollama/ollama:latest
    restart: 'no'
    volumes:
      - ./.ollama:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3:1.7b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'ollama pull "$$LLM_MODEL" && ollama pull "$$EMBEDDING_MODEL" && ollama run "$$LLM_MODEL" /no_think hi',
      ]
    depends_on:
      ollama:
        condition: service_healthy

  api:
    image: bliiva:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - '3100:3000'
    env_file:
      - .env
    extra_hosts:
      # Optional: reach Blivap running on the host machine.
      - 'host.docker.internal:host-gateway'
    environment:
      PORT: 3000
      SEED_ON_START: 'true'
      LLM_ENABLED: 'true'
      # In-compose Ollama only — never host brew Ollama.
      LLM_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3:1.7b}
      # Catalog knowledge grounds how-tos without embedding thrash on small VMs.
      RAG_ENABLED: 'false'
      LLM_NUM_CTX: ${LLM_NUM_CTX:-1024}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-192}
      LLM_MAX_CONTEXT_TOKENS: ${LLM_MAX_CONTEXT_TOKENS:-1536}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-180000}
      LLM_KEEP_ALIVE: ${LLM_KEEP_ALIVE:-30m}
      MONGODB_URI: mongodb://mongo:27017/bliiva_support
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 1
      BLIVAP_API_BASE_URL: http://host.docker.internal:2001
      BLIVAP_CLIENT: http
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-warm:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
