# Live / production API only.
# MongoDB and Redis come from connection strings in .env — not Compose services.
# LLM runs on a private inference host (LLM_BASE_URL). stack-check verifies it.
#
# Required in .env:
#   MONGODB_URI=mongodb+srv://...   (or mongodb://user:pass@host:27017/bliiva_support)
#   REDIS_URL=rediss://...          (or redis://host:6379/1)
#   SUPPORT_SERVICE_API_KEY=...
#   BLIIVA_IMAGE=ghcr.io/...
#   LLM_ENABLED=true
#   LLM_BASE_URL=http://bliiva-llm.internal:11434
#
# Usage:
#   yarn docker:live
#   # or: docker compose -f docker-compose.prod.yml up -d && docker compose -f docker-compose.prod.yml run --rm stack-check

name: bliiva-live

services:
  api:
    image: ${BLIIVA_IMAGE:?Set BLIIVA_IMAGE to the published ghcr.io image}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - '2002:2002'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-2002}
      # Live data stores — only from env connection strings (never Compose mongo/redis).
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI to the live MongoDB connection string}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL to the live Redis connection string}
      # Clear discrete Redis host vars so REDIS_URL is the only source in live.
      REDIS_HOST: ''
      REDIS_PORT: ''
      REDIS_PASSWORD: ''
      # Live must use the private Ollama host — fail stack-check if unset/disabled.
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_BASE_URL: ${LLM_BASE_URL:?Set LLM_BASE_URL to the private Ollama URL}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/'+(process.env.API_PREFIX||'api/v1')+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # After API is healthy: require LLM boot probe (chat) to succeed before deploy is OK.
  # Profile keeps this oneshot out of `docker compose up --wait`.
  # Run via: yarn docker:live  or  docker compose -f docker-compose.prod.yml run --rm stack-check
  stack-check:
    profiles: ['check']
    image: curlimages/curl:8.12.1
    restart: 'no'
    volumes:
      - ./scripts/stack-check.sh:/stack-check.sh:ro
    environment:
      HEALTH_BASE: http://api:${PORT:-2002}/api/v1
      HEALTH_RETRIES: '40'
      LLM_RETRIES: '90'
    entrypoint: ['/bin/sh', '/stack-check.sh']
    depends_on:
      api:
        condition: service_healthy
