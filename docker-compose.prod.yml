# Live / production stack.
# MongoDB and Redis come from connection strings in .env — not Compose services.
# Ollama runs beside the API on this Compose network, same as docker-compose.yml.
# The API always uses http://ollama:11434. Port 11434 is not published.
#
# Required in .env:
#   MONGODB_URI=mongodb+srv://...   (or mongodb://user:pass@host:27017/bliiva_support)
#   REDIS_URL=rediss://...          (or redis://host:6379/1)
#   SUPPORT_SERVICE_API_KEY=...
#   BLIIVA_IMAGE=ghcr.io/...
#   LLM_ENABLED=true
#
# Usage:
#   yarn docker:live
#   # or: docker compose -f docker-compose.prod.yml up -d && docker compose -f docker-compose.prod.yml run --rm stack-check

name: bliiva-live

services:
  # Same role as local Compose `ollama`: reachable only on this network.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - bliiva_ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${LLM_KEEP_ALIVE:-30m}
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  ollama-warm:
    image: curlimages/curl:8.12.1
    restart: 'no'
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'set -e; echo "warming $$LLM_MODEL"; curl -sf "$$OLLAMA_HOST/api/tags" >/dev/null; curl -sf "$$OLLAMA_HOST/api/pull" -d "{\"name\":\"$$LLM_MODEL\"}"; curl -sf "$$OLLAMA_HOST/api/pull" -d "{\"name\":\"$$EMBEDDING_MODEL\"}"; curl -sf "$$OLLAMA_HOST/api/chat" -d "{\"model\":\"$$LLM_MODEL\",\"stream\":false,\"think\":false,\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"options\":{\"num_predict\":16}}"; echo warm-ok',
      ]
    depends_on:
      ollama:
        condition: service_healthy

  api:
    image: ${BLIIVA_IMAGE:?Set BLIIVA_IMAGE to the published ghcr.io image}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - '2002:2002'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-2002}
      # Live data stores — only from env connection strings (never Compose mongo/redis).
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI to the live MongoDB connection string}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL to the live Redis connection string}
      # Clear discrete Redis host vars so REDIS_URL is the only source in live.
      REDIS_HOST: ''
      REDIS_PORT: ''
      REDIS_PASSWORD: ''
      # In-compose Ollama only. Overrides any LLM_BASE_URL in .env.
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/'+(process.env.API_PREFIX||'api/v1')+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    depends_on:
      ollama:
        condition: service_healthy
      ollama-warm:
        condition: service_completed_successfully

  # After API is healthy: require LLM boot probe (chat) to succeed before deploy is OK.
  # Profile keeps this oneshot out of `docker compose up --wait`.
  # Run via: yarn docker:live  or  docker compose -f docker-compose.prod.yml run --rm stack-check
  stack-check:
    profiles: ['check']
    image: curlimages/curl:8.12.1
    restart: 'no'
    volumes:
      - ./scripts/stack-check.sh:/stack-check.sh:ro
    environment:
      HEALTH_BASE: http://api:${PORT:-2002}/api/v1
      HEALTH_RETRIES: '40'
      LLM_RETRIES: '90'
    entrypoint: ['/bin/sh', '/stack-check.sh']
    depends_on:
      api:
        condition: service_healthy

volumes:
  bliiva_ollama:
